[project]
name = "auralink-ml"
version = "1.0.0"
description = "Pipelines de datos y ML de Aura Link: compilación de red GTFS, previsión, data fusion y alertas por umbral"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "holidays>=0.60",
    "mlflow-skinny>=2.17",
    "truststore>=0.10",
]

[project.scripts]
auralink-ml = "auralink_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "pandas-stubs>=2.2", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralink_ml"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "N", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "auralink_ml.forecasting.demand"
disallow_untyped_calls = false  # MLflow expone parte de su API sin tipos

[tool.pytest.ini_options]
testpaths = ["tests"]
