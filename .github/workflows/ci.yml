name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ML · lint, tipos y tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Auditoría de dependencias
        run: uvx pip-audit --strict -r <(uv export --no-dev --no-hashes --format requirements-txt)
        shell: bash

  web:
    name: Web · lint, tipos, tests y build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  docs:
    name: Docs · compilación Typst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v4
      - name: Compilar documentos
        run: |
          mkdir -p docs/pdf
          for f in docs/[0-9]*.typ; do
            typst compile --root . --font-path docs/template/fonts "$f" "docs/pdf/$(basename "${f%.typ}").pdf"
          done
      - uses: actions/upload-artifact@v4
        with: { name: docs-pdf, path: docs/pdf }

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json, artifact-name: sbom.cdx.json }
